<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUMVEN Pro — Prospección</title>
    <style>
        :root {
            --bg-dark: #0b071e; --card-bg: #161133;
            --primary: #a855f7; --accent: #ec4899;
            --text: #f3f4f6; --muted: #9ca3af;
            --success: #22c55e; --danger: #ef4444;
        }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-dark); color: var(--text);
            margin: 0; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 2px solid var(--card-bg); padding-bottom: 15px; }
        .header h1 { background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; }
        h3 { color: var(--primary); margin: 0 0 10px 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 0.9rem; }
        select, textarea { width: 100%; background: var(--bg-dark); border: 1px solid #3b2d75; color: var(--text); padding: 10px; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { background: linear-gradient(to right, var(--primary), var(--accent)); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn-restore { background: none; border: 1px solid var(--muted); color: var(--muted); padding: 4px 8px; font-size: 0.75rem; width: auto; margin-top: 5px; }
        .results-box { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .lead-item { background: var(--bg-dark); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .lead-name { font-weight: bold; }
        .lead-phone { font-size: 0.8rem; color: var(--muted); }
        .actions { display: flex; gap: 8px; }
        .btn-wa { background: #25d366; color: white; padding: 8px 12px; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: inline-block; }
        .btn-copy { background: #4b5563; color: white; padding: 8px 12px; border: none; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .stats { display: flex; gap: 15px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AUMVEN Pro</h1>
        <p style="color: var(--muted); margin: 5px 0 0 0;">Generador Independiente de Prospección</p>
    </div>
    <div class="grid">
        <div class="card">
            <h3>✍️ Paso 1 — Mensaje</h3>
            <label>Tipo de negocio</label>
            <select id="businessType">
                <option value="Almacén">🏪 Almacén / Minimarket</option>
                <option value="Botillería">🍾 Botillería</option>
                <option value="Verdulería">🥬 Verdulería</option>
            </select>
            <label>Mensaje personalizado</label>
            <textarea id="messageTemplate" rows="10"></textarea>
            <button class="btn-restore" onclick="restoreDefaultMessage()">↺ Restaurar plantilla</button>
        </div>
        <div class="card">
            <h3>📋 Paso 2 — Negocios</h3>
            <p style="font-size: 0.8rem; color: var(--muted); margin: 0 0 10px 0;">Formatos aceptados: Nombre | Teléfono o Nombre / Teléfono o Nombre , Teléfono</p>
            <textarea id="rawLeads" rows="12" placeholder="Almacén Don Pedro | 56912345678&#10;Fijo a descartar | 56322554433"></textarea>
            <button onclick="processLeads()">⚡ Generar links</button>
        </div>
    </div>
    <div class="results-box" id="resultsPanel" style="display: none;">
        <div class="stats">
            <span style="color: var(--success)" id="countValid">✅ Válidos: 0</span>
            <span style="color: var(--danger)" id="countInvalid">❌ Fijos descartados: 0</span>
        </div>
        <div id="leadsList"></div>
    </div>
</div>

<script>
    const defaultMessage = `Hola, ¿hablo con el dueño/a de [NOMBRE]? 👋\n\nLos encontré en Google Maps buscando negocios de la zona y quise escribirles directamente.\n\nDesarrollé una herramienta 100% chilena que ayuda a almacenes como el suyo a que sus clientes compren un poco más cada visita — sin bajar precios ni invertir en publicidad.\n\nFunciona así: el cliente compra sobre un monto que ustedes definen, recibe un código y juega desde su celular 🎮 Gana un premio al instante y eso lo hace volver más seguido.\n\nEstoy buscando 5 negocios en la zona para probarlo GRATIS por 30 días, sin costo ni compromiso.\n\n¿Le envío un video de 1 minuto mostrando cómo funciona? 📱`;
    
    document.getElementById('messageTemplate').value = defaultMessage;
    function restoreDefaultMessage() { document.getElementById('messageTemplate').value = defaultMessage; }

    function cleanPhoneNumber(phoneStr) {
        let clean = phoneStr.replace(/\D/g, '');
        if (clean.length === 9 && clean.startsWith('9')) clean = '56' + clean;
        return clean;
    }

    function isFixedLine(phoneStr) {
        if (phoneStr.startsWith('56')) {
            if (phoneStr.charAt(2) !== '9') return true;
        }
        return false;
    }

    function processLeads() {
        const template = document.getElementById('messageTemplate').value;
        const lines = document.getElementById('rawLeads').value.split('\n');
        const leadsListDiv = document.getElementById('leadsList');
        leadsListDiv.innerHTML = '';
        let validCount = 0, invalidCount = 0;

        lines.forEach(line => {
            if (!line.trim()) return;
            
            let separator = '';
            if (line.includes('|')) separator = '|';
            else if (line.includes('/')) separator = '/';
            else if (line.includes(',')) separator = ',';
            else return;

            const parts = line.split(separator);
            const name = parts[0].trim();
            const cleanPhone = cleanPhoneNumber(parts[1].trim());

            if (isFixedLine(cleanPhone) || cleanPhone.length < 11) {
                invalidCount++; return;
            }
            validCount++;

            const customizedMessage = template.replace(/\[NOMBRE\]/g, name);
          const waLink = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(customizedMessage);


            const leadItem = document.createElement('div');
            leadItem.className = 'lead-item';
            leadItem.innerHTML = `
                <div>
                    <div class="lead-name">${name}</div>
                    <div class="lead-phone">📱 +${cleanPhone}</div>
                </div>
                <div class="actions">
                    <button class="btn-copy" onclick="copyToClipboard('${waLink}')">📋 Link</button>
                    <a href="${waLink}" target="_blank" class="btn-wa">💬 Enviar</a>
                </div>`;
            leadsListDiv.appendChild(leadItem);
        });

        document.getElementById('countValid').innerText = `✅ Válidos: ${validCount}`;
        document.getElementById('countInvalid').innerText = `❌ Fijos descartados: ${invalidCount}`;
        document.getElementById('resultsPanel').style.display = (validCount > 0 || invalidCount > 0) ? 'block' : 'none';
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert('¡Link copiado!'));
    }
</script>
</body>
</html>
