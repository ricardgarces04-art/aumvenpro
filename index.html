<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUMVEN Pro - Prospección Inteligente</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #10b981; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; height: 100px; resize: vertical; }
        button { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #059669; }
        .resultados { margin-top: 20px; padding: 15px; background: #f9fafb; border-radius: 5px; border-left: 5px solid #10b981; }
        .link-item { margin-bottom: 10px; padding: 8px; background: white; border: 1px solid #e5e7eb; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .btn-wa { background: #25D366; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; display: inline-block; }
        .btn-wa:hover { background: #128C7E; }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 Generador de Links WhatsApp</h2>
    <p><strong>AUMVEN Pro</strong> — Prospección inteligente para comercios locales</p>
    
    <label>✍️ Paso 1 — Configura tu mensaje</label>
    <textarea id="textoMensaje">Hola, ¿hablo con el dueño/a de [NOMBRE]? 👋
Los encontré en Google Maps buscando negocios de la zona. Desarrollé una herramienta de fidelización que ayuda a comercios locales a aumentar sus ventas usando juegos digitales 🎮. ¿Le mando un video de 1 minuto para verlo en acción?</textarea>
    
    <label>📍 Paso 2 — Ingresa los negocios (Nombre | Teléfono)</label>
    <textarea id="listaNegocios" placeholder="Almacén Don Pedro | 56912345678">Almacén Don Pedro | 56912345678
Botillería El Barril | 56987654321</textarea>
    
    <button onclick="procesarProspeccion()">⚡ Generar links de WhatsApp</button>
    
    <div class="resultados">
        <h3>📊 Resultados:</h3>
        <div id="contenedorLinks">Los links generados aparecerán aquí...</div>
    </div>
</div>

<script>
function procesarProspeccion() {
    let msg = document.getElementById("textoMensaje").value;
    let lista = document.getElementById("listaNegocios").value;
    let box = document.getElementById("contenedorLinks");
    box.innerHTML = "";
    
    lista.split("\n").forEach(linea => {
        if (!linea.includes("|")) return;
        let [nombre, telefono] = linea.split("|");
        nombre = nombre.trim();
        telefono = telefono.trim().replace(/\s+/g, '');

        if (telefono.includes("5632") || telefono.length < 9) {
            box.innerHTML += `<div class="link-item" style="border-left:3px solid red;"><span>❌ ${nombre} (Inválido)</span></div>`;
            return;
        }

        if (telefono.startsWith("9")) telefono = "56" + telefono;
        if (!telefono.startsWith("569")) telefono = "569" + telefono;

        let txtCoded = encodeURIComponent(msg.replace("[NOMBRE]", nombre));
        
        // Formato oficial que abre la app nativa o versión web sin problemas
        let link = "https://whatsapp.com" + telefono + "&text=" + txtCoded;
        
        box.innerHTML += `
            <div class="link-item">
                <span>✅ <strong>${nombre}</strong></span>
                <a href="${link}" target="_blank" class="btn-wa">Abrir Chat</a>
            </div>
        `;
    });
}
</script>

</body>
</html>
